# Deploy Capricorn Growth OS to Azure App Service.
#
# Targets the app in CAPRICORN'S OWN Azure tenant (docs/capricorn-tenant-move.md). The original
# Smartr365-hosted app is deployed by hand (scripts/deployment/deploy-manual.sh) until it is retired.
#
# SKELETON — manual trigger only until a federated credential is created. To activate, in
# Capricorn's tenant:
#   1. Create an Entra app registration (or reuse one) with a federated credential for this repo:
#        az ad app federated-credential create --id <appId> --parameters '{
#          "name":"github-deploy","issuer":"https://token.actions.githubusercontent.com",
#          "subject":"repo:CapricornFinancialGroup/<repo>:ref:refs/heads/main","audiences":["api://AzureADTokenExchange"]}'
#   2. Grant that identity Website Contributor on rg-capgrowth-prod.
#   3. Set repo secrets AZURE_CLIENT_ID / AZURE_TENANT_ID (fa37ee9e-e248-4da9-a076-87139ff736da) /
#      AZURE_SUBSCRIPTION_ID (5d09ba11-2848-4b53-8b6d-71aaefb0f1db).
#   4. Change `on:` to include `push: { branches: [main] }`.

name: deploy

on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: capgrowth-app-prod

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, lint, test, build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm run build:web

      - name: Stage production bundle
        run: |
          mkdir stage
          cp -R dist package.json package-lock.json stage/
          cd stage && npm ci --omit=dev --ignore-scripts

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: stage

      - name: Smoke
        run: |
          sleep 10
          curl -fsS "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz"
          curl -fsS "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz/lake"
